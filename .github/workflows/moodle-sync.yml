name: Moodle → Notion sync

on:
  schedule:
    - cron: "13 6 * * *"   # щодня о 06:13 UTC = 09:13 Kyiv (UTC+3)
  workflow_dispatch:       # дозволяє запустити вручну з GitHub UI

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r moodle-to-notion/requirements.txt

      - name: Run sync
        run: python moodle-to-notion/main.py
        env:
          NOTION_TOKEN:                ${{ secrets.MOODLE_NOTION_TOKEN }}
          MOODLE_USERNAME:             ${{ secrets.MOODLE_USERNAME }}
          MOODLE_PASSWORD:             ${{ secrets.MOODLE_PASSWORD }}
          YOUTUBE_API_KEY:             ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          NOTION_DB_ID:                ${{ secrets.NOTION_DB_ID }}
          CRISIS_TOPICS_DB_ID:         ${{ secrets.CRISIS_TOPICS_DB_ID }}
          MOODLE_DRIVE_FOLDER_ID:      ${{ secrets.MOODLE_DRIVE_FOLDER_ID }}
          MOODLE_BASE_URL:             ${{ secrets.MOODLE_BASE_URL }}
          MOODLE_COURSE_IDS:           ${{ secrets.MOODLE_COURSE_IDS }}
